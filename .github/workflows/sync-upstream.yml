name: Sync Upstream

on:
  schedule:
    - cron: '30 0 * * 6'  # Weelkly on Saturday at 12:30 AM UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Check if second Saturday
      id: check
      run: |
        day=$(date +%d)
        if [ "$day" -ge 8 ] && [ "$day" -le 14 ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run only if second Saturday
      if: steps.check.outputs.run == 'true'
      run: echo "Doing the actual work here"
      
    - name: Checkout fork
      uses: actions/checkout@v3

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Pull upstream changes
      run: |
        git remote add upstream https://github.com/macvk/dnsleaktest.git
        git fetch upstream
        git merge upstream/master --allow-unrelated-histories -m "Sync upstream"
        git push origin master

    - name: Trigger image rebuild
      run: |
        curl -X POST https://api.github.com/repos/dskmnky/dnsleaktest-image/dispatches \
        -H "Accept: application/vnd.github.v3+json" \
        -H "Authorization: token ${{ secrets.REPO_TRIGGER_TOKEN }}" \
        -d '{"event_type":"dnsleaktest-updated"}'
